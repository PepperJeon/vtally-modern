<!DOCTYPE html>
<!--
  data-theme is the hook the Tailwind/shadcn conversion targets (the `dark:`
  variant in src/client/index.css resolves against it). It is hardcoded, not
  toggled and not read from prefers-color-scheme: design-tokens.md §2 declines
  a light theme outright — a light UI in a dark control room is a flashlight in
  the operator's face. The attribute exists so the variant has something to
  match and so a future *dimmer* has somewhere to hang, not so a theme can be
  switched.
-->
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <link rel="alternate icon" type="image/png" href="/favicon.png">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <meta name="viewport" content="minimum-scale=1, initial-scale=1, width=device-width" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="vTally Hub"
    />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="/manifest.json" />
    <!--
      Paths above are absolute. Vite serves everything under publicDir from the
      site root, so CRA's %PUBLIC_URL% placeholder is no longer needed.
    -->
    <title>vTally Hub</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
