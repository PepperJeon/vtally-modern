<!DOCTYPE html>
<!--
  data-theme is the hook the Tailwind/shadcn conversion targets (the `dark:`
  variant in src/client/index.css resolves against it). It is hardcoded, not
  toggled and not read from prefers-color-scheme: design-tokens.md §2 declines
  a light theme outright — a light UI in a dark control room is a flashlight in
  the operator's face. The attribute exists so the variant has something to
  match and so a future *dimmer* has somewhere to hang, not so a theme can be
  switched.
-->
<!--
  lang is the app's DEFAULT (Korean), not a fixed value: src/client/i18n
  rewrites it on boot and on every language switch, because it is what screen
  readers pick pronunciation from and what the `:lang(ko)` rules in
  index.css / lib/utils.ts match on. It is unrelated to the data-theme note
  above — do not treat that comment as covering this attribute.
-->
<html lang="ko" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <link rel="alternate icon" type="image/png" href="/favicon.png">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <meta name="viewport" content="minimum-scale=1, initial-scale=1, width=device-width" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="vTally Hub"
    />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="/manifest.json" />
    <!--
      Paths above are absolute. Vite serves everything under publicDir from the
      site root, so CRA's %PUBLIC_URL% placeholder is no longer needed.
    -->
    <title>vTally 허브</title>
  </head>
  <body>
    <!--
      Both languages, Korean first. This is the one string that cannot be
      swapped at runtime — JavaScript is off when it is read — so it cannot go
      through the i18n table like everything else (i18n-plan.md §5).
    -->
    <noscript>이 앱을 사용하려면 JavaScript를 활성화해야 합니다. / You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
